# Optional convenience wrapper. Equivalent to:
#   docker run -d --name finally -v finally-data:/app/db -p 8000:8000 --env-file .env finally
# Usage: cp .env.example .env && docker compose up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally:latest
    container_name: finally
    ports:
      - "${FINALLY_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Explicit (also baked into the image) so a .env entry can't point the DB off the volume.
      FINALLY_DB_PATH: /app/db/finally.db
      STATIC_DIR: /app/static
    volumes:
      - finally-data:/app/db
    restart: unless-stopped

volumes:
  finally-data:
    name: finally-data
