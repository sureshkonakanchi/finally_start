# FinAlly CI (GitHub mirror of the Azure DevOps pipeline's unit + build + E2E stages).
# Deployment lives in azure-pipelines.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv run --extra dev ruff check app tests
      - name: pytest
        env:
          LLM_MOCK: 'true'
        run: |
          mkdir -p reports
          uv run --extra dev pytest -q --junitxml=reports/pytest-junit.xml \
            --cov=app --cov-report=xml:reports/coverage.xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: backend/reports/

  frontend:
    name: Frontend (vitest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Unit tests
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports
          path: frontend/reports/

  e2e:
    name: Build image + E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: docker build
        run: docker build -t finally:${{ github.sha }} .
      - name: Run Playwright E2E
        env:
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/ci/run_e2e.sh finally:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test/playwright-report/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test/results/
